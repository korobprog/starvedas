services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_REFERRAL_SITE_URL: ${NEXT_PUBLIC_REFERRAL_SITE_URL:-https://chintamanidhama.ru}
      CURATOR_MINI_APP_SITE_URL: ${CURATOR_MINI_APP_SITE_URL:-https://chintamanidhama.ru}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      CURATOR_TELEGRAM_BOT_TOKEN: ${CURATOR_TELEGRAM_BOT_TOKEN}
      CURATOR_TELEGRAM_BOT_USERNAME: ${CURATOR_TELEGRAM_BOT_USERNAME}
      NEXT_PUBLIC_CURATOR_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_CURATOR_TELEGRAM_BOT_USERNAME}
      CURATOR_TELEGRAM_WEBHOOK_SECRET: ${CURATOR_TELEGRAM_WEBHOOK_SECRET}
      CURATOR_TELEGRAM_WEBHOOK_URL: ${CURATOR_TELEGRAM_WEBHOOK_URL:-https://chintamanidhama.ru/api/telegram/curator/webhook}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL}
      TELEGRAM_API_IPS: ${TELEGRAM_API_IPS:-149.154.167.220}
      PRODAMUS_MERCHANT_ID: ${PRODAMUS_MERCHANT_ID}
      PRODAMUS_SECRET_KEY: ${PRODAMUS_SECRET_KEY}
      PRODAMUS_API_URL: ${PRODAMUS_API_URL}
      PRODAMUS_SUCCESS_URL: ${PRODAMUS_SUCCESS_URL}
      PRODAMUS_FAIL_URL: ${PRODAMUS_FAIL_URL}
      PRODAMUS_WEBHOOK_SECRET: ${PRODAMUS_WEBHOOK_SECRET}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY}
      ACCOUNTING_SYNC_SECRET: ${ACCOUNTING_SYNC_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starvedas
      POSTGRES_USER: starvedas
      POSTGRES_PASSWORD: starvedas
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
