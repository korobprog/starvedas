services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      PRODAMUS_MERCHANT_ID: ${PRODAMUS_MERCHANT_ID}
      PRODAMUS_SECRET_KEY: ${PRODAMUS_SECRET_KEY}
      PRODAMUS_API_URL: ${PRODAMUS_API_URL}
      PRODAMUS_SUCCESS_URL: ${PRODAMUS_SUCCESS_URL}
      PRODAMUS_FAIL_URL: ${PRODAMUS_FAIL_URL}
      PRODAMUS_WEBHOOK_SECRET: ${PRODAMUS_WEBHOOK_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starvedas
      POSTGRES_USER: starvedas
      POSTGRES_PASSWORD: starvedas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
